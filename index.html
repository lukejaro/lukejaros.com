<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1914" />
    <meta
      name="description"
      content="Luke Jaroszewski — Austin. Trails. Miles."
    />
    <title>Luke Jaroszewski</title>
    <link rel="preload" as="image" href="images/ig-07.jpg" fetchpriority="high" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip" href="#end">Skip to links</a>

    <main class="journal">
      <article class="still still--open">
        <img
          src="images/ig-07.jpg"
          alt="Sitting on a rocky summit above a sea of clouds"
          width="1080"
          height="1440"
          fetchpriority="high"
        />
        <header class="open">
          <h1>Luke Jaroszewski</h1>
          <p>Austin. Trails. Miles.</p>
        </header>
      </article>

      <figure class="still">
        <img
          src="images/ig-10.jpg"
          alt="Group hike on a mountain trail"
          width="1080"
          height="1920"
          loading="lazy"
        />
        <figcaption>7 mile hike</figcaption>
      </figure>

      <figure class="still">
        <img
          src="images/ig-12.jpg"
          alt="Mountain biking in Whitefish, Montana"
          width="720"
          height="1280"
          loading="lazy"
        />
        <figcaption>Whitefish</figcaption>
      </figure>

      <figure class="still">
        <img
          src="images/ig-03.jpg"
          alt="Skiing at Red River in cowboy hats"
          width="720"
          height="1280"
          loading="lazy"
        />
        <figcaption>Red River</figcaption>
      </figure>

      <figure class="still">
        <img
          src="images/ig-04.jpg"
          alt="Cowboy hats and skis at Red River"
          width="720"
          height="1280"
          loading="lazy"
        />
        <figcaption>First rodeo</figcaption>
      </figure>

      <figure class="still still--wide">
        <img
          src="images/ig-01.jpg"
          alt="Friends at the Barbarossa Trough"
          width="1080"
          height="608"
          loading="lazy"
        />
        <figcaption>Barbarossa Trough</figcaption>
      </figure>

      <figure class="still">
        <img
          src="images/ig-09.jpg"
          alt="Beach sunset with family"
          width="1080"
          height="1440"
          loading="lazy"
        />
        <figcaption>Beach sunset</figcaption>
      </figure>

      <figure class="still still--officiant">
        <img
          src="images/ig-02.jpg"
          alt="Officiating his brother's wedding"
          width="1080"
          height="1440"
          loading="lazy"
        />
        <figcaption>Best man</figcaption>
      </figure>

      <figure class="still still--crew">
        <img
          src="images/ig-05.jpg"
          alt="Friends at a mountain ski town"
          width="1080"
          height="1918"
          loading="lazy"
        />
      </figure>

      <article class="still still--end" id="end">
        <img
          src="images/ig-08.jpg"
          alt="Night out with friends"
          width="1080"
          height="1281"
          loading="lazy"
        />
        <nav class="end" aria-label="Elsewhere">
          <a
            href="https://strava.app.link/O4lWutDeKTb"
            target="_blank"
            rel="noopener noreferrer"
            >Strava</a
          >
          <a
            href="https://www.instagram.com/lukejaros/"
            target="_blank"
            rel="noopener noreferrer"
            >Instagram</a
          >
          <a
            href="https://www.linkedin.com/in/luke-j"
            target="_blank"
            rel="noopener noreferrer"
            >LinkedIn</a
          >
          <a
            href="https://github.com/lukejaro"
            target="_blank"
            rel="noopener noreferrer"
            >GitHub</a
          >
          <div id="strava-feed" class="strava-line" hidden></div>
        </nav>
      </article>
    </main>

    <script src="script.js"></script>
  </body>
</html>
