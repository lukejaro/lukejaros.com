name: Deploy to Mac mini

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, macOS, mac-mini]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to site directory
        run: bash deploy/deploy-site.sh
        env:
          DEPLOY_PATH: /var/www/lukejaros.com